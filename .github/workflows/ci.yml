name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:starter
      - run: npm run test:reader
      - run: npm run test:arxiv-id
      - run: npm run test:audit-checkpoints
      - run: npm run test:body-limits
      - run: npm run test:vault
      - run: npm run test:sessions
      - run: npm run audit-formulas
